name: Build and release

# Push a tag like v1.0.0 to build the Windows .exe and the macOS .dmg and
# publish them as a GitHub release. Can also be run by hand from the Actions tab
# (then it only builds and uploads the files as workflow artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: dist/*.exe
            app: dist/win-unpacked/The Getaway Route.exe
          - os: macos-latest
            target: --mac
            files: dist/*.dmg
            app: dist/mac-universal/The Getaway Route.app/Contents/MacOS/The Getaway Route
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install build tools
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: node --test tests/unit.test.js
      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Launch check (the built app opens and the game starts)
        run: node tests/smoke-app.mjs "${{ matrix.app }}"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: The Getaway Route ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: out/*
